name: course checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Stubs match solutions
        run: python tools/make_stubs.py --check
      - name: Types (pyright, strict)
        run: pyright
      - name: Every test passes on the reference solutions
        run: pytest --solutions
